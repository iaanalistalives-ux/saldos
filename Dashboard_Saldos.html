<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saldos 2025–2026 · LIVES</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--petrol:#0E3B36;--emer:#10B981;--sage:#0F7A5A;--sage-dark:#0B815E;--slate:#4E6B78;--taupe:#B45309;--rose:#DC2626;--tan:#F59E0B;--warm:#DCE5E2;--warm-light:#F1F6F4;--stone:#5F726C;--card:#fff;--sh:0 1px 3px rgba(14,59,54,.06),0 1px 2px rgba(14,59,54,.04);--sh-h:0 4px 12px rgba(14,59,54,.10);--r:12px;}
*{box-sizing:border-box;}
body{margin:0;background:var(--warm-light);color:#333;font-family:Calibri,Arial,sans-serif;font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;}
.header{background:var(--petrol);border-bottom:3px solid var(--emer);min-height:70px;display:flex;align-items:center;gap:16px;padding:0 22px;flex-wrap:wrap;}
.header img{height:38px;display:block;}
.divider{width:1px;height:34px;background:rgba(255,255,255,.3);}
.htitle{color:#fff;font-size:17px;font-weight:700;letter-spacing:.2px;}
.wrap{width:100%;margin:0 auto;padding:18px clamp(16px,2.2vw,52px) 44px;}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:10px 14px;margin-bottom:14px;position:sticky;top:0;z-index:15;}
.seg{display:inline-flex;background:var(--warm-light);border-radius:8px;padding:3px;gap:2px;}
.seg button{background:none;border:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--stone);padding:6px 14px;border-radius:6px;cursor:pointer;}
.seg button.active{background:var(--sage);color:#fff;box-shadow:var(--sh);}
select,input[type=search]{font-family:inherit;font-size:13.5px;font-weight:700;color:var(--sage);border:1px solid var(--warm);border-radius:8px;padding:7px 12px;background:#fff;}
input[type=search]{font-weight:400;color:#333;min-width:200px;}
.btn{font-family:inherit;font-size:13px;font-weight:700;border-radius:8px;padding:8px 14px;cursor:pointer;border:1px solid var(--warm);background:#fff;color:var(--sage);}
.btn:hover{border-color:var(--sage);}
.spacer{margin-left:auto;}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:14px;}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;}
.kpi .banda{display:block;height:5px;background:var(--sage);}
.kpi.neutro .banda{background:var(--slate);}
.kpi .cuerpo{padding:16px 18px 18px;flex:1;}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--stone);}
.kpi .row{display:flex;align-items:baseline;gap:10px;margin-top:8px;flex-wrap:wrap;}
.kpi .v{font-size:46px;font-weight:700;line-height:1;color:var(--sage);letter-spacing:-1.5px;}
.kpi.neutro .v{color:var(--slate);}
.kpi .d{font-size:13px;font-weight:700;padding:4px 11px;border-radius:20px;}
.d.up{color:var(--rose);background:#FCEBEB;}.d.down{color:var(--sage);background:#E7F4EF;}.d.flat{color:var(--stone);background:var(--warm-light);}
.kpi .s{font-size:11.5px;color:var(--stone);margin-top:6px;}
.kpi.hero{background:var(--petrol);}.kpi.hero .banda{background:var(--emer);}
.kpi.hero .l,.kpi.hero .s{color:#8FB3AC;}.kpi.hero .v{color:#fff;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--warm);margin:22px 0 14px;flex-wrap:wrap;}
.tabs button{background:none;border:none;font-family:inherit;font-size:13.5px;font-weight:700;color:var(--stone);padding:10px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;}
.tabs button:hover{color:var(--sage);}
.tabs button.active{color:var(--sage-dark);border-bottom-color:var(--sage);}
.tabpane{display:none;}.tabpane.active{display:block;}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;}
.col12{grid-column:span 12;}.col8{grid-column:span 8;}.col6{grid-column:span 6;}.col4{grid-column:span 4;}
@media(max-width:1100px){.col8,.col6,.col4{grid-column:span 12;}}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px 18px 16px;position:relative;overflow:hidden;min-width:0;}
.panel .tira{position:absolute;left:0;right:0;top:0;height:4px;background:var(--warm);}
.tira.resultado{background:var(--sage)!important;}.tira.riesgo{background:var(--rose)!important;}.tira.volumen{background:var(--slate)!important;}
.panel .pt{font-size:15px;font-weight:700;}
.panel .ph{font-size:11.5px;color:var(--stone);margin-top:2px;margin-bottom:12px;max-width:130ch;}
.cwrap{position:relative;width:100%;height:clamp(220px,26vh,320px);}
.cwrap.tall{height:clamp(260px,34vh,400px);}
.cwrap canvas{position:absolute;inset:0;}
@media(min-width:1700px){.kpis{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}.cwrap{height:clamp(260px,28vh,380px);}.cwrap.tall{height:clamp(300px,36vh,460px);}}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--stone);border-bottom:1px solid var(--warm);padding:8px 6px;}
td{padding:8px 6px;border-bottom:1px solid var(--warm-light);}
tr:hover td{background:var(--warm-light);}
th.r,td.r{text-align:right;}
.tw{overflow-x:auto;}
.rank{list-style:none;margin:0;padding:0;}
.rank li{display:grid;grid-template-columns:24px 1fr 70px;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--warm-light);}
.rank .n{width:24px;height:24px;border-radius:50%;background:var(--warm-light);color:var(--stone);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.rank .nm{font-size:13px;font-weight:700;}
.rank .sb{font-size:11.5px;color:var(--stone);font-weight:400;}
.rank .track{height:7px;background:var(--warm-light);border-radius:4px;margin-top:5px;overflow:hidden;}
.rank .fill{height:100%;border-radius:4px;background:var(--slate);}
.rank .val{text-align:right;font-size:15px;font-weight:700;}
.lsTope500{font-size:12px;color:#5F726C;text-align:center;padding:8px 0;}
.vacio{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:28px;text-align:center;color:var(--stone);}
.vacio2{color:var(--stone);font-size:13px;padding:10px 0;}
.verdet{display:none;}
@media(max-width:900px){.wrap{padding:14px 14px 36px;}.col12,.col8,.col6,.col4{grid-column:span 12;}}
@media(max-width:600px){
 body{font-size:13.5px;}
 .header{min-height:auto;padding:12px 14px;gap:10px;}.header img{height:30px;}.divider{display:none;}.htitle{font-size:15px;}
 .bar{position:static;flex-wrap:nowrap;overflow-x:auto;padding:8px 10px;gap:8px;}.bar::-webkit-scrollbar{display:none;}.bar>*{flex:none;}
 .btn,select,.seg button,input[type=search]{min-height:44px;font-size:14px;}.spacer{display:none;}
 .kpis{grid-template-columns:1fr;gap:10px;}.kpi .v{font-size:38px;}
 .cwrap,.cwrap.tall{height:260px;}
 .tabs{flex-wrap:nowrap;overflow-x:auto;gap:0;}.tabs::-webkit-scrollbar{display:none;}.tabs button{flex:none;padding:12px 14px;font-size:13px;}
 .panel{padding:18px 14px 14px;}table{min-width:520px;}
 .panel.plegable.plegado .tw,.panel.plegable.plegado .cwrap{display:none!important;}
 .verdet{display:block;width:100%;margin-top:10px;background:#fff;border:1px solid var(--warm);color:var(--sage);border-radius:8px;padding:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;min-height:44px;}
}
@media print{@page{size:A4 landscape;margin:9mm;}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
 .bar,.tabs,.verdet{display:none!important;}body{background:#fff;}.tabpane{display:block!important;}.panel,.kpi{box-shadow:none;border:1px solid var(--warm);break-inside:avoid;}
 .kpi.hero{background:#fff!important;}.kpi.hero .v{color:var(--sage)!important;}.kpi.hero .l,.kpi.hero .s{color:var(--stone)!important;}.cwrap{height:170px!important;}}
</style>
</head>

         { campo:"horas",      titulo:"H. asistidas",tipo:"horas" }
       ],
       filas: MIS_DATOS
     });
   ========================================================================== */

var LIVES_XLS = {
  PETROLEO:'FF0E3B36', SALVIA:'FF0F7A5A', SALVIA_OSC:'FF0B815E', SLATE:'FF4E6B78',
  TAUPE:'FFB45309', ROSA:'FFDC2626', WARM:'FFF1F6F4', BORDE:'FFDCE5E2',
  LOGO_B64:'' /* pegar aquí el base64 del logo blanco 96px, sin el prefijo data: */
};

/* Formatos por tipo de dato. Regla: 2 decimales como máximo, nunca más.
   El texto va con '@' para que Excel no convierta códigos como "07-A" en fechas. */
var LIVES_FORMATOS = {
  texto        : '@',
  alfanumerico : '@',
  entero       : '#,##0',
  decimal      : '#,##0.00',
  decimal3     : '#,##0.000',    /* excepción: solo si el dato pierde sentido con 2 */
  porcentaje   : '0.00%',        /* el valor va como fracción: 0.529 -> 52.90% */
  porcentaje0  : '0%',
  moneda       : '"S/ "#,##0.00',
  dolar        : '"$ "#,##0.00',
  fraccion     : '# ?/?',
  horas        : '#,##0.0" h"',  /* horas decimales: 22.2 h */
  duracion     : '[h]:mm',       /* duración real, admite pasar de 24 h */
  fecha        : 'dd/mm/yyyy',
  fecha_hora   : 'dd/mm/yyyy hh:mm',
  mes          : 'mmm yyyy'
};

/* Si no se declara el tipo, se deduce de los valores de la columna. */
function livesDetectarTipo(filas, campo){
  var vistos = 0, num = 0, ent = 0, fec = 0, frac01 = 0;
  for(var i=0;i<filas.length;i++){
    var v = filas[i][campo];
    if(v===null||v===undefined||v==='') continue;
    vistos++;
    if(v instanceof Date){ fec++; continue; }
    if(typeof v === 'number' && isFinite(v)){
      num++;
      if(Math.abs(v % 1) < 1e-9) ent++;
      if(v>=0 && v<=1) frac01++;
    }
  }
  if(!vistos) return 'texto';
  if(fec === vistos) return 'fecha';
  if(num !== vistos) return 'texto';
  if(frac01 === vistos && ent !== vistos) return 'porcentaje';
  if(ent === vistos) return 'entero';
  return 'decimal';
}

/* -----------------------------------------------------------------------------
   Contexto del dashboard. El título, el período y la fórmula NO se inventan:
   se toman de lo que ya dice la propia herramienta en pantalla. Si no hay de
   dónde sacarlos, se omiten — una cabecera vacía es honesta; una inventada no.
   Orden de búsqueda, primero el que exista:
     titulo -> cfg.titulo | CFG.titulo | #hTitulo | document.title
     sub    -> cfg.sub    | #hEstado (estado de filtros actual)
     formula-> cfg.formula| CFG.formula   (nunca se deduce ni se redacta)
   -------------------------------------------------------------------------- */
function livesTexto(sel){
  var el = document.querySelector(sel);
  if(!el) return '';
  return (el.innerText || el.textContent || '').replace(/\s+/g,' ').trim();
}
function livesContexto(cfg){
  var G = (typeof CFG !== 'undefined') ? CFG : {};
  var titulo = cfg.titulo || G.titulo || livesTexto('#hTitulo') ||
               (document.title || '').replace(/\s*·\s*LIVES\s*$/,'').trim();
  var sub    = cfg.sub    || livesTexto('#hEstado') || G.subtitulo || '';
  var formula= cfg.formula|| G.formula || '';
  /* Si se exporta un panel concreto, su propio título manda sobre el del tablero. */
  if(cfg.panel){
    var t = livesTexto(cfg.panel + ' .pt');
    if(t) titulo = titulo ? (titulo + ' — ' + t) : t;
    var h = livesTexto(cfg.panel + ' .ph');
    if(h && !formula) formula = h;
  }
  return { titulo: titulo, sub: sub, formula: formula,
           origen: cfg.origen || G.titulo || livesTexto('#hTitulo') || '' };
}
/* Nombre de archivo: del título real, sin tildes ni espacios. Tampoco se inventa. */
function livesNombreArchivo(titulo, sub){
  var base = (titulo + (sub ? '_' + sub : ''))
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,90);
  return (base || 'Reporte_LIVES') + '.xlsx';
}

async function exportarExcelLIVES(cfg){
  if(typeof ExcelJS === 'undefined')
    throw new Error('Falta ExcelJS. SheetJS no escribe colores; hay que cargar ExcelJS por CDN.');

  var ctx   = livesContexto(cfg);
  var cols  = cfg.columnas || [];
  var filas = cfg.filas || [];
  var n     = cols.length;
  if(!n) throw new Error('No hay columnas que exportar.');

  var wb = new ExcelJS.Workbook();
  wb.creator = 'LIVES';
  wb.created = new Date();
  var hoja = wb.addWorksheet(cfg.hoja || 'Resumen', {
    views:[{ state:'frozen', xSplit: cfg.congelarCols||0, ySplit: 0 }],
    pageSetup:{ orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 }
  });

  /* ---------- fila 1: banda de marca con logo y título ---------- */
  hoja.mergeCells(1,1,1,n);
  hoja.getRow(1).height = 34;
  var c1 = hoja.getCell(1,1);
  c1.value = ctx.titulo;
  c1.fill  = { type:'pattern', pattern:'solid', fgColor:{argb:LIVES_XLS.PETROLEO} };
  c1.font  = { name:'Calibri', size:13, bold:true, color:{argb:'FFFFFFFF'} };
  /* Alineado a la izquierda, no centrado: en tablas anchas (30, 40, 50 columnas) un
     título centrado queda a mitad del ancho y no se ve al abrir el archivo. El indent
     lo despega del logo. */
  c1.alignment = { vertical:'middle', horizontal:'left', indent:18 };

  if(LIVES_XLS.LOGO_B64){
    var img = wb.addImage({ base64: LIVES_XLS.LOGO_B64, extension:'png' });
    /* 120 x 31 respeta la proporción real del logo (3.85:1). No cambiar solo uno de los dos. */
    hoja.addImage(img, { tl:{ col:0.12, row:0.22 }, ext:{ width:120, height:31 } });
  }

  /* ---------- fila 2: subtítulo / período ---------- */
  var fila = 2;
  if(ctx.sub){
    hoja.mergeCells(fila,1,fila,n);
    var c2 = hoja.getCell(fila,1);
    c2.value = ctx.sub;
    c2.fill  = { type:'pattern', pattern:'solid', fgColor:{argb:LIVES_XLS.SLATE} };
    c2.font  = { name:'Calibri', size:10, bold:true, color:{argb:'FFFFFFFF'} };
    c2.alignment = { vertical:'middle', horizontal:'left', indent:18 };
    hoja.getRow(fila).height = 18;
    fila++;
  }

  /* ---------- fila 3: cómo se calcula ---------- */
  if(ctx.formula){
    hoja.mergeCells(fila,1,fila,n);
    var c3 = hoja.getCell(fila,1);
    c3.value = ctx.formula;
    c3.font  = { name:'Calibri', size:9, italic:true, color:{argb:'FF5F726C'} };
    c3.alignment = { vertical:'middle', horizontal:'left', indent:1 };
    hoja.getRow(fila).height = 16;
    fila++;
  }

  /* ---------- encabezados ---------- */
  var filaEnc = fila;
  cols.forEach(function(c,j){
    var cel = hoja.getCell(filaEnc, j+1);
    cel.value = c.titulo || c.campo;
    cel.fill  = { type:'pattern', pattern:'solid', fgColor:{argb: c.color || LIVES_XLS.SALVIA_OSC} };
    cel.font  = { name:'Calibri', size:11, bold:true, color:{argb:'FFFFFFFF'} };
    cel.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    cel.border = { bottom:{ style:'thin', color:{argb:LIVES_XLS.BORDE} } };
  });
  hoja.getRow(filaEnc).height = 22;
  hoja.views = [{ state:'frozen', xSplit: cfg.congelarCols||0, ySplit: filaEnc }];

  /* ---------- tipos: declarados o deducidos ---------- */
  var tipos = cols.map(function(c){
    return c.tipo || livesDetectarTipo(filas, c.campo);
  });

  /* ---------- datos ---------- */
  filas.forEach(function(f, i){
    var r = filaEnc + 1 + i;
    var par = (i % 2 === 1);
    cols.forEach(function(c, j){
      var cel = hoja.getCell(r, j+1);
      var v = f[c.campo];
      /* Sin dato = celda vacía. Un cero es un dato; un vacío es la ausencia de dato. */
      cel.value = (v===null||v===undefined||v==='') ? null : v;
      /* 'formato' permite un formato de Excel propio para una columna concreta.
         Es la única manera aprobada de pasarse de 2 decimales, y debe justificarse. */
      cel.numFmt = c.formato || LIVES_FORMATOS[tipos[j]] || '@';
      cel.font = { name:'Calibri', size:11, color:{argb:'FF333333'} };
      cel.alignment = {
        vertical:'middle',
        horizontal: (tipos[j]==='texto'||tipos[j]==='alfanumerico') ? 'left' : 'right'
      };
      if(par) cel.fill = { type:'pattern', pattern:'solid', fgColor:{argb:LIVES_XLS.WARM} };
      cel.border = { bottom:{ style:'hair', color:{argb:LIVES_XLS.BORDE} } };
    });
  });

  /* ---------- pie de trazabilidad ---------- */
  var filaPie = filaEnc + filas.length + 2;
  hoja.mergeCells(filaPie,1,filaPie,n);
  var cp = hoja.getCell(filaPie,1);
  cp.value = 'Generado el ' + new Date().toLocaleDateString('es-PE') +
             (ctx.origen ? ' desde ' + ctx.origen : '') +
             ' · ' + filas.length + ' fila(s)';
  cp.font = { name:'Calibri', size:9, italic:true, color:{argb:'FF5F726C'} };

  /* ---------- anchos: declarados o calculados por contenido ---------- */
  cols.forEach(function(c,j){
    if(c.ancho){ hoja.getColumn(j+1).width = c.ancho; return; }
    var max = String(c.titulo||c.campo).length;
    for(var i=0;i<filas.length;i++){
      var v = filas[i][c.campo];
      if(v===null||v===undefined) continue;
      var L = (v instanceof Date) ? 10 :
              (typeof v==='number') ? String(Math.round(v)).length + 4 : String(v).length;
      if(L>max) max = L;
    }
    hoja.getColumn(j+1).width = Math.min(Math.max(max + 3, 9), 42);
  });

  hoja.autoFilter = {
    from:{ row:filaEnc, column:1 },
    to:{ row:filaEnc + filas.length, column:n }
  };

  /* ---------- descarga ---------- */
  var buf = await wb.xlsx.writeBuffer();
  var blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cfg.archivo || livesNombreArchivo(ctx.titulo, ctx.sub);
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

</script>

function pMot(A,B,ys){
 const mots=[...new Set(D.map(r=>r.mo))].sort((a,b)=>sum(D.filter(r=>r.mo===b))-sum(D.filter(r=>r.mo===a)));
 const rows=group(A,'c').map(o=>{const x=A.filter(r=>r.c===o.k),t=sum(x),v=mots.map(m=>sum(x.filter(r=>r.mo===m)));return [esc(o.k),...v.map(fmt),fmt(t),pct(t-v[0],t)];});
 document.getElementById('p1').innerHTML=`<div class="grid">${panel('col6','riesgo','Prendas por motivo y año','Prendas en saldo por motivo. Casi todo es "Saldos" a secas; los otros dos motivos son la excepción.',cv('cMot'))}
 ${panel('col6','riesgo','Motivos distintos de "Saldos", por mes','Prendas "No aceptados por cliente" o "Fuera de fecha de embarque", por mes, con el filtro actual.',cv('cMot2'))}
 ${panel('col12','riesgo','Motivo por cliente','Prendas por motivo. % no estándar = (no aceptados + fuera de fecha) ÷ total de prendas en saldo de ese cliente.',table(['Cliente',...mots,'Total','% no estándar'],rows,mots.map((_,i)=>i+1).concat([mots.length+1,mots.length+2])))}</div>`;
 mk('cMot',barsCfg(mots,ys.map(y=>({label:yl(y),backgroundColor:YC[y],data:mots.map(m=>sum(B.filter(r=>r.y===y&&r.mo===m)))})),false));

function pAtk(A,tot){
 const op=group(A,'op').slice(0,8).map(o=>{const r=A.find(x=>x.op===o.k);o.nm='OP '+o.k;o.sb=r.c+' · '+r.e;return o;});
 const es=group(A,'e').slice(0,8).map(o=>{const r=A.find(x=>x.e===o.k);o.nm=o.k;o.sb=r.c+' · '+o.ops.size+' OPs';return o;});
 const nz=A.filter(r=>r.mo!=='Saldos');
 const mo=group(nz,'op').slice(0,8).map(o=>{const r=nz.find(x=>x.op===o.k);o.nm='OP '+o.k;o.sb=r.c+' · '+r.mo;return o;});
 document.getElementById('p4').innerHTML=`<div class="grid">${panel('col4','riesgo','Órdenes (OP) con más saldo','8 OPs con más prendas en saldo.',rank(op,tot))}
 ${panel('col4','riesgo','Estilos con más saldo','8 estilos con más prendas en saldo.',rank(es,tot))}
 ${panel('col4','riesgo','OPs con saldo no estándar','8 OPs con prendas "No aceptados por cliente" o "Fuera de fecha de embarque".',rank(mo,tot))}</div>`;
}
function detRows(){const q=S.q.trim().toLowerCase();let a=sel();if(q)a=a.filter(r=>(r.op+' '+r.po+' '+r.e+' '+r.co+' '+r.c+' '+r.t+' '+r.mo).toLowerCase().includes(q));return a.slice().sort((x,y)=>y.f.localeCompare(x.f)||x.op.localeCompare(y.op));}

function plegar(){const mv=matchMedia('(max-width:600px)').matches;document.querySelectorAll('.panel').forEach(p=>{if(!p.querySelector('table'))return;if(!mv){p.classList.remove('plegable','plegado');return;}if(p.classList.contains('plegable'))return;p.classList.add('plegable','plegado');const b=document.createElement('button');b.type='button';b.className='verdet';b.textContent='Ver tabla';b.onclick=()=>{const s=p.classList.toggle('plegado');b.textContent=s?'Ver tabla':'Ocultar tabla';};p.appendChild(b);});}
