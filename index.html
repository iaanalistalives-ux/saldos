<script>
/* ===== EXPORTADOR EXCEL LIVES v1 ===== */
/* =============================================================================
   EXPORTADOR EXCEL LIVES v1
   Pegar tal cual en cualquier dashboard o formulario LIVES.
   Requiere ExcelJS por CDN (SheetJS NO sirve: no escribe colores). Agregar al <head>:
     script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"
   (etiqueta script normal; aquí va sin los signos < > porque un cierre de script dentro
   de un comentario corta el bloque del HTML donde se pegue este archivo)

   Uso mínimo:
     exportarExcelLIVES({
       archivo: "Inspeccion_Resumen_Set2026.xlsx",
       titulo : "Inspección Final — Resumen",
       sub    : "Set 2026 · datos hasta el 9/09",
       formula: "Eficiencia = minutos producidos ÷ minutos asistidos",
       columnas: [
         { campo:"inspectora", titulo:"Inspectora",  tipo:"texto",      ancho:26 },
         { campo:"lote",       titulo:"Lote",        tipo:"entero" },
         { campo:"efic",       titulo:"% Eficiencia",tipo:"porcentaje" },
         { campo:"horas",      titulo:"H. asistidas",tipo:"horas" }
       ],
       filas: MIS_DATOS
     });
   ========================================================================== */

var LIVES_XLS = {
  PETROLEO:'FF0E3B36', SALVIA:'FF0F7A5A', SALVIA_OSC:'FF0B815E', SLATE:'FF4E6B78',
  TAUPE:'FFB45309', ROSA:'FFDC2626', WARM:'FFF1F6F4', BORDE:'FFDCE5E2',
  LOGO_B64:'' /* pegar aquí el base64 del logo blanco 96px, sin el prefijo data: */
};

/* Formatos por tipo de dato. Regla: 2 decimales como máximo, nunca más.
   El texto va con '@' para que Excel no convierta códigos como "07-A" en fechas. */
var LIVES_FORMATOS = {
  texto        : '@',
  alfanumerico : '@',
  entero       : '#,##0',
  decimal      : '#,##0.00',
  decimal3     : '#,##0.000',    /* excepción: solo si el dato pierde sentido con 2 */
  porcentaje   : '0.00%',        /* el valor va como fracción: 0.529 -> 52.90% */
  porcentaje0  : '0%',
  moneda       : '"S/ "#,##0.00',
  dolar        : '"$ "#,##0.00',
  fraccion     : '# ?/?',
  horas        : '#,##0.0" h"',  /* horas decimales: 22.2 h */
  duracion     : '[h]:mm',       /* duración real, admite pasar de 24 h */
  fecha        : 'dd/mm/yyyy',
  fecha_hora   : 'dd/mm/yyyy hh:mm',
  mes          : 'mmm yyyy'
};

/* Si no se declara el tipo, se deduce de los valores de la columna. */
function livesDetectarTipo(filas, campo){
  var vistos = 0, num = 0, ent = 0, fec = 0, frac01 = 0;
  for(var i=0;i<filas.length;i++){
    var v = filas[i][campo];
    if(v===null||v===undefined||v==='') continue;
    vistos++;
    if(v instanceof Date){ fec++; continue; }
    if(typeof v === 'number' && isFinite(v)){
      num++;
      if(Math.abs(v % 1) < 1e-9) ent++;
      if(v>=0 && v<=1) frac01++;
    }
  }
  if(!vistos) return 'texto';
  if(fec === vistos) return 'fecha';
  if(num !== vistos) return 'texto';
  if(frac01 === vistos && ent !== vistos) return 'porcentaje';
  if(ent === vistos) return 'entero';
  return 'decimal';
}

/* -----------------------------------------------------------------------------
   Contexto del dashboard. El título, el período y la fórmula NO se inventan:
   se toman de lo que ya dice la propia herramienta en pantalla. Si no hay de
   dónde sacarlos, se omiten — una cabecera vacía es honesta; una inventada no.
   Orden de búsqueda, primero el que exista:
     titulo -> cfg.titulo | CFG.titulo | #hTitulo | document.title
     sub    -> cfg.sub    | #hEstado (estado de filtros actual)
     formula-> cfg.formula| CFG.formula   (nunca se deduce ni se redacta)
   -------------------------------------------------------------------------- */
function livesTexto(sel){
  var el = document.querySelector(sel);
  if(!el) return '';
  return (el.innerText || el.textContent || '').replace(/\s+/g,' ').trim();
}
function livesContexto(cfg){
  var G = (typeof CFG !== 'undefined') ? CFG : {};
  var titulo = cfg.titulo || G.titulo || livesTexto('#hTitulo') ||
               (document.title || '').replace(/\s*·\s*LIVES\s*$/,'').trim();
  var sub    = cfg.sub    || livesTexto('#hEstado') || G.subtitulo || '';
  var formula= cfg.formula|| G.formula || '';
  /* Si se exporta un panel concreto, su propio título manda sobre el del tablero. */
  if(cfg.panel){
    var t = livesTexto(cfg.panel + ' .pt');
    if(t) titulo = titulo ? (titulo + ' — ' + t) : t;
    var h = livesTexto(cfg.panel + ' .ph');
    if(h && !formula) formula = h;
  }
  return { titulo: titulo, sub: sub, formula: formula,
           origen: cfg.origen || G.titulo || livesTexto('#hTitulo') || '' };
}
/* Nombre de archivo: del título real, sin tildes ni espacios. Tampoco se inventa. */
function livesNombreArchivo(titulo, sub){
  var base = (titulo + (sub ? '_' + sub : ''))
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,90);
  return (base || 'Reporte_LIVES') + '.xlsx';
}

async function exportarExcelLIVES(cfg){
  if(typeof ExcelJS === 'undefined')
    throw new Error('Falta ExcelJS. SheetJS no escribe colores; hay que cargar ExcelJS por CDN.');

  var ctx   = livesContexto(cfg);
  var cols  = cfg.columnas || [];
  var filas = cfg.filas || [];
  var n     = cols.length;
  if(!n) throw new Error('No hay columnas que exportar.');

  var wb = new ExcelJS.Workbook();
  wb.creator = 'LIVES';
  wb.created = new Date();
  var hoja = wb.addWorksheet(cfg.hoja || 'Resumen', {
    views:[{ state:'frozen', xSplit: cfg.congelarCols||0, ySplit: 0 }],
    pageSetup:{ orientation:'landscape', fitToPage:true, fitToWidth:1, fitToHeight:0 }
  });

  /* ---------- fila 1: banda de marca con logo y título ---------- */
  hoja.mergeCells(1,1,1,n);
  hoja.getRow(1).height = 34;
  var c1 = hoja.getCell(1,1);
  c1.value = ctx.titulo;
  c1.fill  = { type:'pattern', pattern:'solid', fgColor:{argb:LIVES_XLS.PETROLEO} };
  c1.font  = { name:'Calibri', size:13, bold:true, color:{argb:'FFFFFFFF'} };
  /* Alineado a la izquierda, no centrado: en tablas anchas (30, 40, 50 columnas) un
     título centrado queda a mitad del ancho y no se ve al abrir el archivo. El indent
     lo despega del logo. */
  c1.alignment = { vertical:'middle', horizontal:'left', indent:18 };

  if(LIVES_XLS.LOGO_B64){
    var img = wb.addImage({ base64: LIVES_XLS.LOGO_B64, extension:'png' });
    /* 120 x 31 respeta la proporción real del logo (3.85:1). No cambiar solo uno de los dos. */
    hoja.addImage(img, { tl:{ col:0.12, row:0.22 }, ext:{ width:120, height:31 } });
  }

  /* ---------- fila 2: subtítulo / período ---------- */
  var fila = 2;
  if(ctx.sub){
    hoja.mergeCells(fila,1,fila,n);
    var c2 = hoja.getCell(fila,1);
    c2.value = ctx.sub;
    c2.fill  = { type:'pattern', pattern:'solid', fgColor:{argb:LIVES_XLS.SLATE} };
    c2.font  = { name:'Calibri', size:10, bold:true, color:{argb:'FFFFFFFF'} };
    c2.alignment = { vertical:'middle', horizontal:'left', indent:18 };
    hoja.getRow(fila).height = 18;
    fila++;
  }

  /* ---------- fila 3: cómo se calcula ---------- */
  if(ctx.formula){
    hoja.mergeCells(fila,1,fila,n);
    var c3 = hoja.getCell(fila,1);
    c3.value = ctx.formula;
    c3.font  = { name:'Calibri', size:9, italic:true, color:{argb:'FF5F726C'} };
    c3.alignment = { vertical:'middle', horizontal:'left', indent:1 };
    hoja.getRow(fila).height = 16;
    fila++;
  }

  /* ---------- encabezados ---------- */
  var filaEnc = fila;
  cols.forEach(function(c,j){
    var cel = hoja.getCell(filaEnc, j+1);
    cel.value = c.titulo || c.campo;
    cel.fill  = { type:'pattern', pattern:'solid', fgColor:{argb: c.color || LIVES_XLS.SALVIA_OSC} };
    cel.font  = { name:'Calibri', size:11, bold:true, color:{argb:'FFFFFFFF'} };
    cel.alignment = { vertical:'middle', horizontal:'center', wrapText:true };
    cel.border = { bottom:{ style:'thin', color:{argb:LIVES_XLS.BORDE} } };
  });
  hoja.getRow(filaEnc).height = 22;
  hoja.views = [{ state:'frozen', xSplit: cfg.congelarCols||0, ySplit: filaEnc }];

  /* ---------- tipos: declarados o deducidos ---------- */
  var tipos = cols.map(function(c){
    return c.tipo || livesDetectarTipo(filas, c.campo);
  });

  /* ---------- datos ---------- */
  filas.forEach(function(f, i){
    var r = filaEnc + 1 + i;
    var par = (i % 2 === 1);
    cols.forEach(function(c, j){
      var cel = hoja.getCell(r, j+1);
      var v = f[c.campo];
      /* Sin dato = celda vacía. Un cero es un dato; un vacío es la ausencia de dato. */
      cel.value = (v===null||v===undefined||v==='') ? null : v;
      /* 'formato' permite un formato de Excel propio para una columna concreta.
         Es la única manera aprobada de pasarse de 2 decimales, y debe justificarse. */
      cel.numFmt = c.formato || LIVES_FORMATOS[tipos[j]] || '@';
      cel.font = { name:'Calibri', size:11, color:{argb:'FF333333'} };
      cel.alignment = {
        vertical:'middle',
        horizontal: (tipos[j]==='texto'||tipos[j]==='alfanumerico') ? 'left' : 'right'
      };
      if(par) cel.fill = { type:'pattern', pattern:'solid', fgColor:{argb:LIVES_XLS.WARM} };
      cel.border = { bottom:{ style:'hair', color:{argb:LIVES_XLS.BORDE} } };
    });
  });

  /* ---------- pie de trazabilidad ---------- */
  var filaPie = filaEnc + filas.length + 2;
  hoja.mergeCells(filaPie,1,filaPie,n);
  var cp = hoja.getCell(filaPie,1);
  cp.value = 'Generado el ' + new Date().toLocaleDateString('es-PE') +
             (ctx.origen ? ' desde ' + ctx.origen : '') +
             ' · ' + filas.length + ' fila(s)';
  cp.font = { name:'Calibri', size:9, italic:true, color:{argb:'FF5F726C'} };

  /* ---------- anchos: declarados o calculados por contenido ---------- */
  cols.forEach(function(c,j){
    if(c.ancho){ hoja.getColumn(j+1).width = c.ancho; return; }
    var max = String(c.titulo||c.campo).length;
    for(var i=0;i<filas.length;i++){
      var v = filas[i][c.campo];
      if(v===null||v===undefined) continue;
      var L = (v instanceof Date) ? 10 :
              (typeof v==='number') ? String(Math.round(v)).length + 4 : String(v).length;
      if(L>max) max = L;
    }
    hoja.getColumn(j+1).width = Math.min(Math.max(max + 3, 9), 42);
  });

  hoja.autoFilter = {
    from:{ row:filaEnc, column:1 },
    to:{ row:filaEnc + filas.length, column:n }
  };

  /* ---------- descarga ---------- */
  var buf = await wb.xlsx.writeBuffer();
  var blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = cfg.archivo || livesNombreArchivo(ctx.titulo, ctx.sub);
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

</script>

function pTend(A,B,ys,T){

 if(comp.length)hom.push([`<b>${MES[comp[0]]}–${MES[comp[comp.length-1]].toLowerCase()}</b>`,'<b>'+pr(q5,x5)+'</b>','<b>'+pr(q6,x6)+'</b>','<b>'+(x5&&x6?pp(q6/x6*100-q5/x5*100):'—')+'</b>']);

 const leg=R?`Largo de la barra = tasa de saldo (saldo ÷ exportadas); solo con al menos ${fmt(S.min)} exportadas.`:'Largo de la barra = prendas en saldo (volumen); la etiqueta agrega la tasa de saldo (saldo ÷ exportadas).';
 const col=` Color = tasa contra el promedio del filtro (${pr(T.q,T.x)}): rojo 1,5 veces o más, verde dos tercios o menos, gris en medio o con poca base. Cambia entre volumen y tasa con "Ordenar por".`;
 const cols=[{h:'Motivo',f:o=>esc(o.k)},{h:'Prendas',r:1,f:o=>fmt(o.q)},{h:'Exportadas',r:1,f:o=>fmt(o.x)},{h:'Tasa de saldo',r:1,f:o=>rc(o,avg)},{h:'% del saldo',r:1,f:o=>pct(o.q,T.q)},{h:'Registros',r:1,f:o=>fmt(o.n)},{h:'OPs',r:1,f:o=>fmt(o.ops.size)}];
 document.getElementById('p3').innerHTML=`<div class="grid">${panel('col6','riesgo','Tallas · '+(R?'mayor tasa de saldo':'prendas en saldo'),`En el orden de las tallas. ${leg}${col}`,tt.length?cv('cTa',true):'<div class="vacio2">Ninguna talla llega al mínimo de exportadas.</div>')}
 ${panel('col6','volumen','Colores · '+(R?'mayor tasa de saldo':'más prendas en saldo'),`15 colores. ${leg}${col}`,cv('cCo',true))}
 ${panel('col12','volumen','Motivo del saldo','Solo el motivo "Saldos" no dice la causa; "No aceptados por cliente" y "Fuera de fecha de embarque" sí. El motivo se filtra desde la barra.',tbl(cols,mo,null))}</div>`;
 if(tt.length)mk('cTa',barsCfg(tt.map(o=>o.k),bset(tt),null,fB));
 mk('cCo',barsCfg(co.map(o=>o.k),bset(co),null,fB));
}
function detRows(){return sel().slice().sort((x,y)=>y.f.localeCompare(x.f)||x.op.localeCompare(y.op));}
function filasDet(v){return `<div class="tw alto"><table><thead><tr>${['Fecha','Cliente','Grupo','OP','PO','Estilo propio','Estilo cliente','Color','Talla','Motivo','Saldo','Exportadas de la línea','% saldo de la línea'].map((h,i)=>`<th class="${i>=10?'r':''}">${h}</th>`).join('')}</tr></thead><tbody>${v.map(r=>`<tr><td>${fdate(r.f)}</td><td>${lk('c',r.c)}</td><td>${lk('g',r.g)}</td><td>${lk('op',r.op,r.op)}</td><td>${lk('po',r.po,r.po)}</td><td>${lk('ep',r.ep)}</td><td>${lk('e',r.e)}</td><td>${esc(r.co)}</td><td>${esc(r.t)}</td><td>${esc(r.mo)}</td><td class="r">${fmt(r.q)}</td><td class="r">${fmt(r.x)}</td><td class="r">${r.x?pr(r.q,r.x):'—'}</td></tr>`).join('')}</tbody></table></div>`;}
function pDet(){
 const a=detRows(),f=filtrado(),v=f?a:a.slice(0,500);
 document.getElementById('p4').innerHTML=`<div class="grid">${panel('col12','','Detalle de saldos','Un registro = una OP, talla y color con saldo en una fecha. Exportadas de la línea = prendas exportadas de esa OP, PO, color y talla (se repite si la línea tiene saldo en varias fechas, pero se cuenta una sola vez en los totales). Lo más reciente arriba. Clic en cliente, grupo, OP, PO o estilo para ver su detalle.',filasDet(v)+(!f&&a.length>500?`<div class="lsTope500">Se muestran los 500 registros más recientes de ${a.length.toLocaleString('es-PE')}. Usa los filtros para ver los demás.</div>`:''),'pn-det')}</div>`;
}
function plegar(){const mv=matchMedia('(max-width:600px)').matches;document.querySelectorAll('#app .panel').forEach(p=>{if(!p.querySelector('table'))return;if(!mv){p.classList.remove('plegable','plegado');return;}if(p.classList.contains('plegable'))return;p.classList.add('plegable','plegado');const b=document.createElement('button');b.type='button';b.className='verdet';b.textContent='Ver tabla';b.onclick=()=>{const s=p.classList.toggle('plegado');b.textContent=s?'Ver tabla':'Ocultar tabla';};p.appendChild(b);});}

/* ---------- Excel ---------- */
const COLS_XLS=[{campo:'f',titulo:'Fecha',tipo:'fecha'},{campo:'c',titulo:'Cliente',tipo:'texto'},{campo:'g',titulo:'Grupo',tipo:'texto'},{campo:'op',titulo:'OP',tipo:'alfanumerico'},{campo:'po',titulo:'PO',tipo:'alfanumerico'},{campo:'ep',titulo:'Estilo propio',tipo:'alfanumerico'},{campo:'e',titulo:'Estilo cliente',tipo:'texto'},{campo:'co',titulo:'Color',tipo:'texto'},{campo:'t',titulo:'Talla',tipo:'alfanumerico'},{campo:'mo',titulo:'Motivo',tipo:'texto'},{campo:'q',titulo:'Saldo (prendas)',tipo:'entero'},{campo:'x',titulo:'Exportadas de la línea',tipo:'entero'},{campo:'pc',titulo:'% saldo de la línea',tipo:'porcentaje'}];
const FORM='Tasa de saldo = prendas en saldo ÷ prendas exportadas de las líneas (OP · PO · color · talla) con saldo. La exportada se cuenta una vez por línea.';
async function bajarXls(a,titulo,sub,archivo){if(!a.length)return;
 await exportarExcelLIVES({archivo,titulo,sub,formula:FORM,origen:'Saldos.xlsx',hoja:'Detalle',congelarCols:0,columnas:COLS_XLS,filas:a.map(r=>({f:new Date(r.f+'T00:00:00'),c:r.c,g:r.g,op:r.op,po:r.po,ep:r.ep,e:r.e,co:r.co,t:r.t,mo:r.mo,q:r.q,x:r.x,pc:r.x?r.q/r.x:null}))});}
async function bajarRes(){const A=sel();if(!A.length)return;const d=S.d,T=agg(A),st=ordenar(stats(A,d)),tot=T.q;
 const cols=[{campo:'k',titulo:DL[d],tipo:'alfanumerico'}];if(d!=='c')cols.push({campo:'cl',titulo:'Cliente',tipo:'texto'});
 cols.push({campo:'q',titulo:'Saldo (prendas)',tipo:'entero'},{campo:'x',titulo:'Exportadas',tipo:'entero'},{campo:'r',titulo:'Tasa de saldo',tipo:'porcentaje'},{campo:'v',titulo:'Vs. promedio (veces)',tipo:'decimal'},{campo:'s',titulo:'% del saldo total',tipo:'porcentaje'},{campo:'o',titulo:'OPs',tipo:'entero'},{campo:'n',titulo:'Fechas con saldo',tipo:'entero'});
 await exportarExcelLIVES({archivo:'Saldos_Resumen_'+d+'.xlsx',titulo:'Saldos — Resumen por '+DL[d].toLowerCase(),sub:subFiltros()+(S.ord==='r'?' · Orden: tasa de saldo (mín. '+fmt(S.min)+' exportadas)':' · Orden: prendas en saldo'),formula:FORM+' Promedio del filtro: '+pr(T.q,T.x)+'.',origen:'Saldos.xlsx',hoja:'Resumen',columnas:cols,filas:st.map(o=>({k:o.k,cl:cl(o),q:o.q,x:o.x,r:o.x?o.rate:null,v:o.x&&T.rate?o.rate/T.rate:null,s:o.q/tot,o:o.ops.size,n:o.v}))});}
function subFiltros(){const p=['Año: '+(S.y==='all'?'2025 y 2026':S.y),'Cliente: '+(S.c||'todos'),'Motivo: '+(S.mo||'todos')];if(S.mes)p.push('Mes: '+MES[+S.mes.slice(5)-1]+' '+S.mes.slice(0,4));if(S.sem)p.push('Semana: '+S.sem.slice(5)+' de '+S.sem.slice(0,4));[['g','Grupo'],['ep','Estilo propio'],['e','Estilo cliente'],['op','OP'],['po','PO']].forEach(([k,t])=>{if(S[k].trim())p.push(t+': '+S[k].trim());});if(S.q.trim())p.push('Búsqueda: '+S.q.trim());return p.join(' · ');}

/* ---------- ventana de detalle ---------- */
const M={stack:[],tab:0,all:false};
function abrir(d,k){const m=document.getElementById('mdl');if(!m.classList.contains('on')){M.stack=[];}M.stack.push({d,k});M.tab=0;m.classList.add('on');document.body.style.overflow='hidden';renderM();}
function cerrarM(){document.getElementById('mdl').classList.remove('on');document.body.style.overflow='';MC.forEach(c=>c.destroy());MC=[];M.stack=[];}
function volverM(){if(M.stack.length>1){M.stack.pop();M.tab=0;renderM();}}
function minitabla(dim,R,qE,avg){
 const s=stats(R,dim);let items=s;
 if(dim==='f')items=s.slice().sort((a,b)=>b.k.localeCompare(a.k));
 else if(dim!=='t')items=s.slice().sort((a,b)=>{const ea=a.x>=S.min&&a.x>0,eb=b.x>=S.min&&b.x>0;return ea!==eb?(ea?-1:1):ea?b.rate-a.rate||b.q-a.q:b.q-a.q;});
 else if(dim==='t')items=s.slice().sort((a,b)=>{const i=TALLAS.indexOf(a.k),j=TALLAS.indexOf(b.k);return (i<0?99:i)-(j<0?99:j)||b.q-a.q;});
 const nav=NAV.has(dim),LIM=10;
 const rows=items.map((o,i)=>`<tr${nav?` class="clk${i>=LIM?' mas':''}" data-d="${dim}" data-k="${esc(o.k)}"`:(i>=LIM?' class="mas"':'')}><td>${nav?lk(dim,o.k):esc(o.k)}</td><td class="r">${fmt(o.q)}</td><td class="r">${fmt(o.x)}</td><td class="r">${rc(o,avg)}</td><td class="r">${pct(o.q,qE)}</td></tr>`).join('');
 const ver=items.length>LIM?`<button type="button" class="verm">Ver todos (${items.length})</button>`:'';
 return `<div class="panel col6 mini"><span class="tira volumen"></span><div class="pt">${NM[dim]} <span class="cnt">${items.length}</span></div><div class="tw"><table><thead><tr><th>${NM[dim]}</th><th class="r">Saldo</th><th class="r">Exportadas</th><th class="r">Tasa</th><th class="r">% del saldo</th></tr></thead><tbody>${rows}</tbody></table></div>${ver}</div>`;
}
function renderM(){
 MC.forEach(c=>c.destroy());MC=[];
 const {d,k}=M.stack[M.stack.length-1],A=sel(),R=A.filter(r=>r[d]===k),TA=agg(A),TR=agg(R),tot=TA.q,q=TR.q;
 const head=document.getElementById('mhead'),body=document.getElementById('mbody');
 head.innerHTML=`${M.stack.length>1?'<button type="button" class="mb" id="mVol">‹ Volver</button>':''}<div class="mt"><span class="mk">${NM[d]}</span> ${esc(lab(d,k))}</div><span class="spacer"></span><button type="button" class="mb" id="mXls">Descargar Excel</button><button type="button" class="mb" id="mCer">✕ Cerrar</button>`;
 document.getElementById('mCer').onclick=cerrarM;
 const bv=document.getElementById('mVol');if(bv)bv.onclick=volverM;
 document.getElementById('mXls').onclick=()=>bajarXls(R.slice().sort((x,y)=>y.f.localeCompare(x.f)||x.op.localeCompare(y.op)),'Saldos — '+NM[d]+' '+lab(d,k),subFiltros(),'Saldos_'+d+'_'+String(k).replace(/[^A-Za-z0-9]+/g,'_')+'.xlsx');
 if(!R.length){body.innerHTML='<div class="vacio">Sin registros para esta selección con los filtros actuales.</div>';return;}
 const fs=[...new Set(R.map(r=>r.f))].sort(),ops=new Set(R.map(r=>r.op));
 const dias=Math.round((new Date(fs[fs.length-1])-new Date(fs[0]))/864e5);
 const chips=[];
 [...DORD,'co','t','mo'].forEach(x=>{if(x===d)return;const vs=[...new Set(R.map(r=>r[x]))];if(vs.length===1)chips.push(`<span class="chip"><b>${NM[x]}:</b> ${NAV.has(x)?lk(x,vs[0]):esc(vs[0])}</span>`);});
 const kp=(l,v,s)=>`<div class="mk4"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
 const tabs=`<div class="tabs mtabs"><button type="button" data-t="0" class="${M.tab===0?'active':''}">Resumen</button><button type="button" data-t="1" class="${M.tab===1?'active':''}">Registros (${R.length.toLocaleString('es-PE')})</button></div>`;
 let cont='';
 if(M.tab===0){
  const dims=[...DORD,'co','t','mo','f'].filter(x=>x!==d&&new Set(R.map(r=>r[x])).size>1);
  cont=`<div class="mgrid"><div class="panel col6 mchart"><span class="tira riesgo"></span><div class="pt">Tasa de saldo por mes</div>${cv('cM',false)}</div><div class="panel col6 mchart"><span class="tira volumen"></span><div class="pt">Prendas en saldo por mes</div>${cv('cM2',false)}</div></div><div class="grid mgrid">${dims.map(x=>minitabla(x,R,q,TR.rate)).join('')}</div>`;
 }else{
  const v=R.slice().sort((x,y)=>y.f.localeCompare(x.f)||x.op.localeCompare(y.op));
  cont=`<div class="panel col12"><span class="tira"></span>${filasDet(v.slice(0,500))}${v.length>500?`<div class="lsTope500">Se muestran los 500 registros más recientes de ${v.length.toLocaleString('es-PE')}. El Excel trae todos.</div>`:''}</div>`;
 }
 const vs=TR.rate&&TA.rate?(TR.rate/TA.rate).toLocaleString('es-PE',{minimumFractionDigits:1,maximumFractionDigits:1})+'× el promedio del filtro ('+pr(TA.q,TA.x)+')':'';
 body.innerHTML=`<div class="chips">${chips.join('')}</div>
 <div class="mk4s">${kp('Tasa de saldo',pr(q,TR.x),vs||'sin prendas exportadas')}${kp('Prendas en saldo',fmt(q),pct(q,tot)+' de '+fmt(tot)+' del filtro')}${kp('Prendas exportadas',fmt(TR.x),fmt(TR.n)+' líneas OP · PO · color · talla')}${kp('OPs',fmt(ops.size),R.length.toLocaleString('es-PE')+' registros')}${kp('Fechas',fmt(fs.length),fs.length>1?'del '+fdate(fs[0])+' al '+fdate(fs[fs.length-1])+' · '+fmt(dias)+' días':fdate(fs[0]))}</div>
 ${tabs}${cont}`;
 body.querySelectorAll('.mtabs button').forEach(b=>b.onclick=()=>{M.tab=+b.dataset.t;renderM();});
 body.querySelectorAll('.verm').forEach(b=>b.onclick=()=>{const p=b.closest('.mini'),o=p.classList.toggle('open');b.textContent=o?'Ver menos':'Ver todos ('+p.querySelectorAll('tbody tr').length+')';});
 if(M.tab===0){
  const ym=new Map();R.forEach(r=>{const key=r.f.slice(0,7);if(!ym.has(key))ym.set(key,[]);ym.get(key).push(r);});
  const ks=[...ym.keys()].sort(),lb=[],dq=[],dr=[];let [y0,m0]=ks[0].split('-').map(Number);const [y1,m1]=ks[ks.length-1].split('-').map(Number);
  while(y0<y1||(y0===y1&&m0<=m1)){const key=y0+'-'+String(m0).padStart(2,'0'),g=ym.get(key),a=g?agg(g):null;lb.push(MES[m0-1]+' '+String(y0).slice(2));dq.push(a?a.q:0);dr.push(a&&a.x?+(a.rate*100).toFixed(2):null);m0++;if(m0>12){m0=1;y0++;}}
  const ds=(data)=>[{label:'',data,borderColor:'#0F7A5A',backgroundColor:'#0F7A5A',borderWidth:3,tension:.15,pointRadius:4,pointBackgroundColor:'#0F7A5A',pointBorderColor:'#fff',pointBorderWidth:2}];
  const op=(f)=>({layout:{padding:{top:30,right:20}},plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,grace:'8%',ticks:{callback:v=>f(v)}},x:{grid:{display:false}}}});
  mk('cM',{type:'line',data:{labels:lb,datasets:ds(dr),fm:pf},options:op(pf),plugins:[etqPunto]},MC);
  mk('cM2',{type:'line',data:{labels:lb,datasets:ds(dq)},options:op(fmt),plugins:[etqPunto]},MC);
 }
 document.getElementById('mbody').scrollTop=0;
}

/* ---------- barra ---------- */
function barra(){
 const sg=document.getElementById('segY');sg.innerHTML=[['all','Todo'],['2025','2025'],['2026','2026']].map(([k,t])=>`<button type="button" data-k="${k}" class="${S.y===k?'active':''}">${t}</button>`).join('');
 sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.y=b.dataset.k;opciones();barra();render();});
 const sd=document.getElementById('segD');sd.innerHTML=DORD.map(k=>`<button type="button" data-k="${k}" class="${S.d===k?'active':''}">${DL[k]}</button>`).join('');
 sd.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.d=b.dataset.k;barra();render();});
 const so=document.getElementById('segO');so.innerHTML=[['q','Prendas en saldo'],['r','Tasa de saldo']].map(([k,t])=>`<button type="button" data-k="${k}" class="${S.ord===k?'active':''}">${t}</button>`).join('');
 so.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.ord=b.dataset.k;barra();render();});
}
function opciones(){
 const Dy=S.y==='all'?D:D.filter(r=>r.y===+S.y);
 const por=key=>{const m=new Map();Dy.forEach(r=>m.set(r[key],(m.get(r[key])||0)+r.q));return [...m.entries()].sort((a,b)=>b[1]-a[1]).map(x=>x[0]);};
 const opt=a=>a.map(c=>`<option value="${esc(c)}">`).join('');
 document.getElementById('fC').innerHTML='<option value="">Todos los clientes</option>'+por('c').map(c=>`<option>${esc(c)}</option>`).join('');
 document.getElementById('fM').innerHTML='<option value="">Todos los motivos</option>'+por('mo').map(c=>`<option>${esc(c)}</option>`).join('');
 [['fG','g','dlG'],['fEp','ep','dlEp'],['fE','e','dlE'],['fOp','op','dlOp'],['fPo','po','dlPo']].forEach(([id,key,dl])=>{document.getElementById(dl).innerHTML=opt(por(key));});
 const ms=[...new Set(Dy.map(r=>r.f.slice(0,7)))].sort().reverse();
 document.getElementById('fMes').innerHTML='<option value="">Todos los meses</option>'+ms.map(k=>`<option value="${k}">${MES[+k.slice(5)-1]} ${k.slice(0,4)}</option>`).join('');
 const wks=new Map();Dy.forEach(r=>{if(wks.has(r.wk))return;const t=new Date(r.f+'T00:00:00Z'),lu=new Date(t-((t.getUTCDay()+6)%7)*864e5),dm=new Date(+lu+6*864e5),f2=x=>x.toISOString().slice(8,10)+'/'+x.toISOString().slice(5,7);wks.set(r.wk,{ini:f2(lu),fin:f2(dm)});});
 document.getElementById('fSem').innerHTML='<option value="">Todas las semanas</option>'+[...wks.keys()].sort().reverse().map(k=>`<option value="${k}">Sem ${+k.slice(5)} · ${k.slice(0,4)} (${wks.get(k).ini} al ${wks.get(k).fin})</option>`).join('');
 [['c','fC'],['mo','fM'],['mes','fMes'],['sem','fSem']].forEach(([k,id])=>{const el=document.getElementById(id);if(S[k]&&![...el.options].some(o=>o.value===S[k]||o.text===S[k])){S[k]='';}el.value=S[k];});
}
(function(){
 opciones();
 document.getElementById('fMin').innerHTML=[0,50,100,500,1000,5000].map(v=>`<option value="${v}">Mínimo exportadas: ${fmt(v)}</option>`).join('');document.getElementById('fMin').value=S.min;
 document.getElementById('fMin').onchange=e=>{S.min=+e.target.value;render();};
 document.getElementById('fMes').onchange=e=>{S.mes=e.target.value;render();};
 document.getElementById('fSem').onchange=e=>{S.sem=e.target.value;render();};
 document.getElementById('fC').onchange=e=>{S.c=e.target.value;render();};
 document.getElementById('fM').onchange=e=>{S.mo=e.target.value;render();};
 const dbn=(id,key)=>{let tm;document.getElementById(id).oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{S[key]=e.target.value;render();},250);};};
 dbn('fG','g');dbn('fEp','ep');dbn('fE','e');dbn('fOp','op');dbn('fPo','po');dbn('fQ','q');
 document.getElementById('bLim').onclick=()=>{Object.assign(S,{y:'all',c:'',mo:'',mes:'',sem:'',g:'',ep:'',e:'',op:'',po:'',q:''});['fG','fEp','fE','fOp','fPo','fQ'].forEach(id=>document.getElementById(id).value='');document.getElementById('fC').value='';document.getElementById('fM').value='';document.getElementById('fMes').value='';document.getElementById('fSem').value='';opciones();barra();render();};
 document.getElementById('bXls').onclick=()=>bajarXls(detRows(),'Saldos — Detalle',subFiltros(),'Saldos_Detalle.xlsx');
 document.getElementById('bRes').onclick=bajarRes;
 document.addEventListener('click',e=>{if(e.target.closest('.verm'))return;const t=e.target.closest('[data-d]');if(t&&t.dataset.k!=null&&!e.target.closest('#segD')){abrir(t.dataset.d,t.dataset.k);}});
 document.getElementById('mdl').addEventListener('click',e=>{if(e.target.id==='mdl')cerrarM();});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('mdl').classList.contains('on'))cerrarM();});
 barra();render();
})();
</script>
